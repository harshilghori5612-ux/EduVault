name: Build EduVault APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate Clean Official Android Project
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.eduvault

      - name: Configure Android Permissions and SDK Versions
        run: |
          python3 -c "
          import os, glob, re

          # 1. Update AndroidManifest.xml
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r') as f:
                  content = f.read()
              perms = '''
              <uses-permission android:name=\"android.permission.CAMERA\" />
              <uses-feature android:name=\"android.hardware.camera\" android:required=\"false\" />
              <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" android:maxSdkVersion=\"32\" />
              <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" android:maxSdkVersion=\"28\" />
              <uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\" />
              <uses-permission android:name=\"android.permission.READ_MEDIA_VIDEO\" />
              '''
              if '<application' in content and 'android.permission.CAMERA' not in content:
                  content = content.replace('<application', perms + '    <application', 1)
                  with open(manifest_path, 'w') as f:
                      f.write(content)
              print('Configured AndroidManifest.xml successfully.')

          # 2. Update SDK versions in app build.gradle / build.gradle.kts
          for p in glob.glob('android/app/build.gradle*'):
              with open(p, 'r') as f:
                  c = f.read()
              # Kotlin DSL & Groovy DSL regex replacements
              c = re.sub(r'minSdk\s*=.*', 'minSdk = 21', c)
              c = re.sub(r'minSdkVersion\s+.*', 'minSdkVersion 21', c)
              c = re.sub(r'compileSdk\s*=.*', 'compileSdk = 34', c)
              c = re.sub(r'compileSdkVersion\s+.*', 'compileSdkVersion 34', c)
              c = re.sub(r'targetSdk\s*=.*', 'targetSdk = 34', c)
              c = re.sub(r'targetSdkVersion\s+.*', 'targetSdkVersion 34', c)
              with open(p, 'w') as f:
                  f.write(c)
              print(f'Configured SDK versions in {p}.')
          "

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: |
          echo "Starting APK build..."
          flutter build apk --debug --verbose 2>&1 | tee build_log.txt

      - name: Attach Build Log to Summary
        if: always()
        run: |
          if [ -f build_log.txt ]; then
            echo "### Build Log Summary" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 80 build_log.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Logs
          path: build_log.txt
          if-no-files-found: ignore

      - name: Locate Output APK
        id: apk_path
        run: |
          APK=$(find build/app/outputs/ -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "Error: No APK file found in build/app/outputs/"
            exit 1
          fi
          echo "Found APK at: $APK"
          echo "apk=$APK" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EduVault-Android-APK
          path: ${{ steps.apk_path.outputs.apk }}
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "EduVault v1.0.0 - Android APK"
          body: "Official APK build for EduVault application. Download the APK file directly to your Android device and install it."
          files: ${{ steps.apk_path.outputs.apk }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
