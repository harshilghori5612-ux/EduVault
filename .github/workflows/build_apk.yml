name: Build EduVault APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate Clean Official Android Project
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.eduvault

      - name: Add Permissions to AndroidManifest.xml
        run: |
          python3 -c "
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r') as f:
              content = f.read()
          perms = '''
              <uses-permission android:name=\"android.permission.CAMERA\" />
              <uses-feature android:name=\"android.hardware.camera\" android:required=\"false\" />
              <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" android:maxSdkVersion=\"32\" />
              <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" android:maxSdkVersion=\"28\" />
              <uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\" />
              <uses-permission android:name=\"android.permission.READ_MEDIA_VIDEO\" />
          '''
          if '<application' in content:
              content = content.replace('<application', perms + '    <application', 1)
              with open(manifest_path, 'w') as f:
                  f.write(content)
          "

      - name: Ensure minSdkVersion is 21 or higher
        run: |
          python3 -c "
          gradle_path = 'android/app/build.gradle'
          with open(gradle_path, 'r') as f:
              content = f.read()
          content = content.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 21')
          content = content.replace('minSdk = flutter.minSdkVersion', 'minSdk = 21')
          with open(gradle_path, 'w') as f:
              f.write(content)
          "

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EduVault-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "EduVault v1.0.0 - Android APK"
          body: "Official release build of the EduVault student records & documents management app."
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
